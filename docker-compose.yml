version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3060:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend/
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - PORT=80

networks:
  internal:
    driver: bridge

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_BACKEND_URL: http://api
    ports:
      - "3060:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=/api
      - INTERNAL_BACKEND_URL=http://api
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - PORT=80

networks:
  internal:
    driver: bridge
